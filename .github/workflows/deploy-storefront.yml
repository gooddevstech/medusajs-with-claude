name: Deploy Storefront

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'storefront/**'
      - '.github/workflows/deploy-storefront.yml'

concurrency:
  group: deploy-storefront
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Storefront
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push storefront image to ECR
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tindahang-storefront
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                       -f storefront/Dockerfile \
                       storefront/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition tindahang-storefront \
            --query taskDefinition > task-definition.json

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: storefront
          image: ${{ steps.image.outputs.image }}

      - name: Deploy to ECS service
        run: |
          aws ecs update-service \
            --cluster tindahang-ecs \
            --service tindahang-storefront \
            --task-definition tindahang-storefront \
            --force-new-deployment

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster tindahang-ecs \
            --services tindahang-storefront

      - name: Verify service health
        run: |
          RUNNING_COUNT=$(aws ecs describe-services \
            --cluster tindahang-ecs \
            --services tindahang-storefront \
            --query 'services[0].runningCount' \
            --output text)
          
          DESIRED_COUNT=$(aws ecs describe-services \
            --cluster tindahang-ecs \
            --services tindahang-storefront \
            --query 'services[0].desiredCount' \
            --output text)
          
          echo "Storefront service: $RUNNING_COUNT/$DESIRED_COUNT tasks running"
          
          if [ "$RUNNING_COUNT" -ne "$DESIRED_COUNT" ]; then
            exit 1
          fi

      - name: Deployment Summary
        run: |
          echo "✅ Storefront deployment completed successfully"
          echo "Image: ${{ steps.image.outputs.image }}"
          echo "Service: tindahang-storefront"
          echo "Cluster: tindahang-ecs"