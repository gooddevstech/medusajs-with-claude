name: Deploy Storefront

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'storefront/**'
      - '.github/workflows/deploy-storefront.yml'

concurrency:
  group: deploy-storefront
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Storefront
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch publishable key from SSM
        id: get-pk
        run: |
          PK=$(aws ssm get-parameter \
            --name /tindaph/medusa_publishable_key \
            --with-decryption \
            --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          if [ -z "$PK" ]; then
            PK="${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}"
          fi
          echo "publishable_key=$PK" >> $GITHUB_OUTPUT

      - name: Build, tag, and push storefront image to ECR
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tindaph-storefront
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                       -f storefront/Dockerfile.prod \
                       --build-arg NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ steps.get-pk.outputs.publishable_key }} \
                       --build-arg NEXT_PUBLIC_MEDUSA_BACKEND_URL=https://api.tindaph.app \
                       --build-arg NEXT_PUBLIC_BASE_URL=https://tindaph.app \
                       storefront/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update storefront Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name tindaph-storefront \
            --image-uri ${{ steps.image.outputs.image }} \
            --region ${{ secrets.AWS_REGION }} \
            --no-cli-pager
          aws lambda wait function-updated \
            --function-name tindaph-storefront \
            --region ${{ secrets.AWS_REGION }}

      - name: Verify storefront Lambda is active
        run: |
          STATE=$(aws lambda get-function \
            --function-name tindaph-storefront \
            --region ${{ secrets.AWS_REGION }} \
            --query 'Configuration.State' --output text)

          echo "Storefront Lambda state: $STATE"

          if [ "$STATE" != "Active" ]; then
            echo "::error::Storefront Lambda is not Active (state: $STATE)"
            exit 1
          fi

      - name: Deployment Summary
        run: |
          echo "✅ Storefront deployment completed successfully"
          echo "Image: ${{ steps.image.outputs.image }}"
          echo "Function: tindaph-storefront"
