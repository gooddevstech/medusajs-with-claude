name: Terraform Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.6.6'
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > tfplan.json
        continue-on-error: true

      - name: Comment PR with Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const changes = 'See plan output below';
            const body = '## Terraform Plan\n\nResources affected:\n\n```\n' + process.env.PLAN_OUTPUT + '\n```';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: outputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "ALB_DNS=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT
          echo "BACKEND_ECR=$(terraform output -raw backend_repository_url)" >> $GITHUB_OUTPUT
          echo "STOREFRONT_ECR=$(terraform output -raw storefront_repository_url)" >> $GITHUB_OUTPUT
          echo "RDS_ENDPOINT=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT
          echo "REDIS_ENDPOINT=$(terraform output -raw redis_endpoint)" >> $GITHUB_OUTPUT

      - name: Create/Update SSM Parameters
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # Database URL
          DATABASE_URL="postgresql://${{ secrets.TF_VAR_db_username }}:${{ secrets.TF_VAR_db_password }}@${{ steps.outputs.outputs.RDS_ENDPOINT }}:5432/${{ secrets.TF_VAR_db_name }}"
          aws ssm put-parameter \
            --name /tindahang/database_url \
            --value "$DATABASE_URL" \
            --type SecureString \
            --overwrite \
            --region ${{ secrets.AWS_REGION }}
          
          # Redis URL
          REDIS_URL="rediss://default:${{ secrets.TF_VAR_redis_password }}@${{ steps.outputs.outputs.REDIS_ENDPOINT }}:6379"
          aws ssm put-parameter \
            --name /tindahang/redis_url \
            --value "$REDIS_URL" \
            --type SecureString \
            --overwrite \
            --region ${{ secrets.AWS_REGION }}
          
          # JWT Secret
          aws ssm put-parameter \
            --name /tindahang/jwt_secret \
            --value "${{ secrets.MEDUSA_JWT_SECRET }}" \
            --type SecureString \
            --overwrite \
            --region ${{ secrets.AWS_REGION }}
          
          # Cookie Secret
          aws ssm put-parameter \
            --name /tindahang/cookie_secret \
            --value "${{ secrets.COOKIE_SECRET }}" \
            --type SecureString \
            --overwrite \
            --region ${{ secrets.AWS_REGION }}
          
          # Medusa Publishable Key
          aws ssm put-parameter \
            --name /tindahang/medusa_publishable_key \
            --value "${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}" \
            --type SecureString \
            --overwrite \
            --region ${{ secrets.AWS_REGION }}
          
          # Revalidate Secret
          aws ssm put-parameter \
            --name /tindahang/revalidate_secret \
            --value "${{ secrets.REVALIDATE_SECRET }}" \
            --type SecureString \
            --overwrite \
            --region ${{ secrets.AWS_REGION }}
          
          echo "✅ SSM Parameters created/updated successfully"

      - name: Create Action Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: terraform-plan
          path: |
            ./infra/tfplan
            ./infra/tfplan.json
          retention-days: 30