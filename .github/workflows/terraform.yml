name: Terraform Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.6.6'

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Remove stale state entries that cause dependency cycles
        run: |
          # These old module.redis resources were never destroyed in the Redis→Valkey migration.
          # They create a cycle: module.redis (destroy) ↔ aws_ssm_parameter.redis_url (update).
          # Removing them from state lets Terraform proceed; the actual AWS resources will be
          # cleaned up separately or left as harmless orphans.
          STALE=(
            "module.redis.aws_elasticache_subnet_group.this[0]"
            "module.redis.random_id.this[0]"
            "module.redis.aws_elasticache_parameter_group.this[0]"
            "module.redis.aws_security_group.this[0]"
            "aws_secretsmanager_secret_version.redis_auth_token"
            "random_password.redis_auth_token"
          )
          for addr in "${STALE[@]}"; do
            terraform state rm "$addr" 2>/dev/null && echo "Removed: $addr" || echo "Not in state (skip): $addr"
          done

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_db_username: ${{ secrets.TF_VAR_DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.MEDUSA_JWT_SECRET }}
          TF_VAR_cookie_secret: ${{ secrets.COOKIE_SECRET }}
          TF_VAR_payrex_secret_key: ${{ secrets.PAYREX_SECRET_KEY }}
          TF_VAR_payrex_webhook_secret: ${{ secrets.PAYREX_WEBHOOK_SECRET }}
          TF_VAR_payrex_publishable_key: ${{ secrets.NEXT_PUBLIC_PAYREX_PUBLIC_KEY }}
          TF_VAR_medusa_publishable_key: ${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
          TF_VAR_revalidate_secret: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > tfplan.json
        continue-on-error: true

      - name: Comment PR with Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const changes = 'See plan output below';
            const body = '## Terraform Plan\n\nResources affected:\n\n```\n' + process.env.PLAN_OUTPUT + '\n```';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Terraform Apply
        if: steps.plan.outcome == 'success'
        env:
          TF_VAR_db_username: ${{ secrets.TF_VAR_DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.MEDUSA_JWT_SECRET }}
          TF_VAR_cookie_secret: ${{ secrets.COOKIE_SECRET }}
          TF_VAR_payrex_secret_key: ${{ secrets.PAYREX_SECRET_KEY }}
          TF_VAR_payrex_webhook_secret: ${{ secrets.PAYREX_WEBHOOK_SECRET }}
          TF_VAR_payrex_publishable_key: ${{ secrets.NEXT_PUBLIC_PAYREX_PUBLIC_KEY }}
          TF_VAR_medusa_publishable_key: ${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
          TF_VAR_revalidate_secret: ${{ secrets.REVALIDATE_SECRET }}
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: outputs
        if: always()
        run: |
          echo "=== Route53 Nameservers. Update your domain registrar here ==="
          terraform output -json route53_nameservers 2>/dev/null || true

      - name: Create Action Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            ./infra/tfplan
            ./infra/tfplan.json
          retention-days: 30
