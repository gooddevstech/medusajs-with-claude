name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'Dockerfile.prod'
      - 'medusa-config.ts'
      - 'tsconfig.json'
      - 'start.sh'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image to ECR
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tindaph-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                       -f Dockerfile.prod .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition tindaph-backend \
            --query taskDefinition > task-definition.json

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ steps.image.outputs.image }}

      - name: Run database migration
        id: migration
        continue-on-error: true
        run: |
          SUBNET=$(aws ec2 describe-subnets \
            --region ${{ secrets.AWS_REGION }} \
            --filters Name=tag:Environment,Values=production \
            --query 'Subnets[0].SubnetId' --output text)
          SG=$(aws ec2 describe-security-groups \
            --region ${{ secrets.AWS_REGION }} \
            --filters Name=tag:Name,Values=*ecs-tasks-sg \
            --query 'SecurityGroups[0].GroupId' --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster tindaph-ecs \
            --task-definition tindaph-backend \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --overrides "containerOverrides=[{name=backend,command=[\"yarn\",\"medusa\",\"db:migrate\"]}]" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster tindaph-ecs --tasks $TASK_ARN || true

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster tindaph-ecs \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          echo "Migration exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ] || echo "::warning::Migration exited with code $EXIT_CODE"

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: tindaph-backend
          cluster: tindaph-ecs
          wait-for-service-stability: true

      - name: Verify service health
        run: |
          RUNNING_COUNT=$(aws ecs describe-services \
            --cluster tindaph-ecs \
            --services tindaph-backend \
            --query 'services[0].runningCount' \
            --output text)

          DESIRED_COUNT=$(aws ecs describe-services \
            --cluster tindaph-ecs \
            --services tindaph-backend \
            --query 'services[0].desiredCount' \
            --output text)

          echo "Backend service: $RUNNING_COUNT/$DESIRED_COUNT tasks running"

          if [ "$RUNNING_COUNT" -ne "$DESIRED_COUNT" ]; then
            exit 1
          fi

      - name: Ensure publishable key is linked to sales channel
        id: publishable-key
        run: |
          SUBNET=$(aws ec2 describe-subnets \
            --region ${{ secrets.AWS_REGION }} \
            --filters Name=tag:Environment,Values=production \
            --query 'Subnets[0].SubnetId' --output text)
          SG=$(aws ec2 describe-security-groups \
            --region ${{ secrets.AWS_REGION }} \
            --filters Name=tag:Name,Values=*ecs-tasks-sg \
            --query 'SecurityGroups[0].GroupId' --output text)

          START_TIME=$(date -u +%s000)

          TASK_ARN=$(aws ecs run-task \
            --cluster tindaph-ecs \
            --task-definition tindaph-backend \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --overrides "containerOverrides=[{name=backend,command=[\"yarn\",\"medusa\",\"exec\",\"./src/scripts/create-publishable-key.ts\"]}]" \
            --query 'tasks[0].taskArn' --output text)

          echo "Publishable key task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster tindaph-ecs --tasks $TASK_ARN

          PK=$(aws logs filter-log-events \
            --log-group-name /ecs/tindaph-backend \
            --start-time $START_TIME \
            --filter-pattern "pk_" \
            --query 'events[0].message' --output text | grep -o 'pk_[a-f0-9]*')

          echo "Publishable key: $PK"

          if [ -z "$PK" ]; then
            echo "::error::Could not retrieve publishable key from logs"
            exit 1
          fi

          CURRENT=$(aws ssm get-parameter \
            --name /tindaph/medusa_publishable_key \
            --with-decryption \
            --query 'Parameter.Value' --output text)

          if [ "$PK" != "$CURRENT" ]; then
            echo "Key changed — updating SSM"
            aws ssm put-parameter \
              --name /tindaph/medusa_publishable_key \
              --value "$PK" \
              --type SecureString \
              --overwrite
            echo "key_changed=true" >> $GITHUB_OUTPUT
          else
            echo "Key unchanged"
            echo "key_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger storefront redeploy if key changed
        if: steps.publishable-key.outputs.key_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-storefront.yml --repo ${{ github.repository }} --ref main

      - name: Deployment Summary
        run: |
          echo "✅ Backend deployment completed successfully"
          echo "Image: ${{ steps.image.outputs.image }}"
          echo "Service: tindaph-backend"
          echo "Cluster: tindaph-ecs"
