name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'Dockerfile.prod'
      - 'medusa-config.ts'
      - 'tsconfig.json'
      - 'start.sh'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image to ECR
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tindaph-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                       -f Dockerfile.prod .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Run database migration
        id: migration
        continue-on-error: true
        run: |
          START_TIME=$(date -u +%s000)

          aws lambda update-function-code \
            --function-name tindaph-backend-migrate \
            --image-uri ${{ steps.image.outputs.image }} \
            --region ${{ secrets.AWS_REGION }} \
            --no-cli-pager
          aws lambda wait function-updated \
            --function-name tindaph-backend-migrate \
            --region ${{ secrets.AWS_REGION }}

          RESULT=$(aws lambda invoke \
            --function-name tindaph-backend-migrate \
            --region ${{ secrets.AWS_REGION }} \
            --log-type Tail \
            --cli-binary-format raw-in-base64-out \
            /tmp/migration-output.json \
            --query 'FunctionError' --output text)

          cat /tmp/migration-output.json
          echo "Migration FunctionError: $RESULT"

          if [ "$RESULT" != "None" ] && [ -n "$RESULT" ]; then
            echo "::warning::Migration returned a FunctionError: $RESULT"
          fi

      - name: Update backend Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name tindaph-backend \
            --image-uri ${{ steps.image.outputs.image }} \
            --region ${{ secrets.AWS_REGION }} \
            --no-cli-pager
          aws lambda wait function-updated \
            --function-name tindaph-backend \
            --region ${{ secrets.AWS_REGION }}

      - name: Verify backend Lambda is active
        run: |
          STATE=$(aws lambda get-function \
            --function-name tindaph-backend \
            --region ${{ secrets.AWS_REGION }} \
            --query 'Configuration.State' --output text)

          echo "Backend Lambda state: $STATE"

          if [ "$STATE" != "Active" ]; then
            echo "::error::Backend Lambda is not Active (state: $STATE)"
            exit 1
          fi

      - name: Ensure publishable key is linked to sales channel
        id: publishable-key
        run: |
          START_TIME=$(date -u +%s000)

          aws lambda update-function-code \
            --function-name tindaph-backend-scripts \
            --image-uri ${{ steps.image.outputs.image }} \
            --region ${{ secrets.AWS_REGION }} \
            --no-cli-pager
          aws lambda wait function-updated \
            --function-name tindaph-backend-scripts \
            --region ${{ secrets.AWS_REGION }}

          aws lambda invoke \
            --function-name tindaph-backend-scripts \
            --region ${{ secrets.AWS_REGION }} \
            --log-type Tail \
            --cli-binary-format raw-in-base64-out \
            /tmp/scripts-output.json \
            --no-cli-pager

          PK=$(aws logs filter-log-events \
            --log-group-name /aws/lambda/tindaph-backend-scripts \
            --start-time $START_TIME \
            --filter-pattern "pk_" \
            --query 'events[0].message' --output text | grep -o 'pk_[a-f0-9]*')

          echo "Publishable key: $PK"

          if [ -z "$PK" ]; then
            echo "::error::Could not retrieve publishable key from logs"
            exit 1
          fi

          CURRENT=$(aws ssm get-parameter \
            --name /tindaph/medusa_publishable_key \
            --with-decryption \
            --query 'Parameter.Value' --output text)

          if [ "$PK" != "$CURRENT" ]; then
            echo "Key changed — updating SSM"
            aws ssm put-parameter \
              --name /tindaph/medusa_publishable_key \
              --value "$PK" \
              --type SecureString \
              --overwrite
            echo "key_changed=true" >> $GITHUB_OUTPUT
          else
            echo "Key unchanged"
            echo "key_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger storefront redeploy if key changed
        if: steps.publishable-key.outputs.key_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-storefront.yml --repo ${{ github.repository }} --ref main

      - name: Deployment Summary
        run: |
          echo "✅ Backend deployment completed successfully"
          echo "Image: ${{ steps.image.outputs.image }}"
          echo "Function: tindaph-backend"
