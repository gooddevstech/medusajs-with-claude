services:
  postgres:
    image: postgres:16-alpine
    container_name: medusa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medusa-v2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: medusa-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  medusa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medusa-backend
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/medusa-v2
      REDIS_URL: redis://valkey:6379
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      COOKIE_SECRET: ${COOKIE_SECRET:-supersecret}
      STORE_CORS: ${STORE_CORS:-http://localhost:8000,http://storefront:8000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:9000,http://localhost:5173}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:9000,http://localhost:5173}
      VITE_HOST: 0.0.0.0
      NODE_OPTIONS: --dns-result-order=ipv4first
      PAYREX_SECRET_KEY: ${PAYREX_SECRET_KEY:-sk_test_your_secret_key_here}
      PAYREX_WEBHOOK_SECRET: ${PAYREX_WEBHOOK_SECRET:-your_webhook_secret_here}
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
    env_file:
      - ./.env

    ports:
      - "9000:9000"
      - "5173:5173"
    volumes:
      - .:/server
      - /server/node_modules
      - /server/.yarn

  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
    container_name: medusa-storefront
    depends_on:
      - medusa
    environment:
      MEDUSA_BACKEND_URL: http://medusa:9000
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_DEFAULT_REGION: ph
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-pk_19e9b9263f9882716b7d2496dd270f282d940074e0e0ec9cdb9a40db5df94ac9}
      REVALIDATE_SECRET: supersecret
      NEXT_PUBLIC_PAYREX_PUBLIC_KEY: ${NEXT_PUBLIC_PAYREX_PUBLIC_KEY:-pk_test_change_me}
    env_file:
      - ./storefront/.env
    ports:
      - "8000:8000"
    volumes:
      - ./storefront:/app
      - /app/node_modules
      - /app/.yarn
      - /app/.next

volumes:
  postgres_data:
  valkey_data:
